  <text x="420.0" y="218.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">Sem buffer de quadro: o Mega tem só 8 kB de RAM.</text>
  <text x="420.0" y="236.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">Menos pacotes por linha = menos quadros da câmera.</text>
