  <text x="24.0" y="34.0" font-size="18" fill="#111827" text-anchor="start" font-weight="600">Captura entrelaçada: o rádio é mais lento que a câmera</text>
  <text x="24.0" y="56.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">Enquanto uma linha é transmitida, a câmera entrega outras; elas são pegas nos quadros seguintes.</text>
