<svg xmlns="http://www.w3.org/2000/svg" width="760" height="222" viewBox="0 0 760 222" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="759" height="221" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="24.0" y="34.0" font-size="18" fill="#111827" text-anchor="start" font-weight="600">Pacote de 32 bytes (limite do nRF24L01+)</text>
  <text x="24.0" y="56.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">4 bytes de cabeçalho + 28 de dados. Cada linha da imagem começa em um pacote novo.</text>
  <text x="61.0" y="84.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">byte 0</text>
  <rect x="24.0" y="92.0" width="71.0" height="44.0" rx="4" fill="#2563eb" stroke="none"/>
  <text x="60.0" y="119.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">flags+seq</text>
  <text x="126.0" y="84.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">byte 1</text>
  <rect x="98.0" y="92.0" width="53.0" height="44.0" rx="4" fill="#2563eb" stroke="none"/>
  <text x="125.0" y="119.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">seq</text>
  <text x="186.0" y="84.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">byte 2</text>
  <rect x="154.0" y="92.0" width="61.0" height="44.0" rx="4" fill="#1d4ed8" stroke="none"/>
  <text x="185.0" y="119.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">quadro</text>
  <text x="250.0" y="84.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">byte 3</text>
  <rect x="218.0" y="92.0" width="61.0" height="44.0" rx="4" fill="#7c3aed" stroke="none"/>
  <text x="249.0" y="119.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">CRC-8</text>
  <text x="311.0" y="84.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">byte 4</text>
  <rect x="282.0" y="92.0" width="55.0" height="44.0" rx="4" fill="#f59e0b" stroke="none"/>
  <text x="310.0" y="119.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">linha</text>
  <text x="366.0" y="84.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">byte 5</text>
  <rect x="340.0" y="92.0" width="49.0" height="44.0" rx="4" fill="#f59e0b" stroke="none"/>
  <text x="365.0" y="119.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">cód.</text>
  <text x="564.0" y="84.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">bytes 6 … 31</text>
  <rect x="392.0" y="92.0" width="341.0" height="44.0" rx="4" fill="#93c5fd" stroke="none"/>
  <text x="563.0" y="119.0" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="600">26 bytes de imagem (bruto, RLE ou Rice)</text>
  <line x1="24.0" y1="150.0" x2="279.0" y2="150.0" stroke="#2563eb" stroke-width="2"/>
  <text x="24.0" y="168.0" font-size="12" fill="#111827" text-anchor="start" font-weight="400">Cabeçalho: início/fim de quadro e de linha, sequência de 12 bits, id do quadro, CRC-8</text>
  <line x1="282.0" y1="184.0" x2="389.0" y2="184.0" stroke="#f59e0b" stroke-width="2"/>
  <text x="282.0" y="202.0" font-size="12" fill="#b45309" text-anchor="start" font-weight="400">Só no 1º pacote de cada linha; os seguintes levam 28 bytes de imagem.</text>
</svg>
